<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empleados</title>
    <link rel="stylesheet" href="/sidebar.css">
</head>
<body>

<div th:replace="/navbar :: navbar"></div>

<div class="main p-4">
    <h2>Empleados</h2>
    <form method="get" th:action="@{/empleados}" class="mb-3 d-flex gap-2">
        <input type="text" name="filtro" th:value="${filtro}" placeholder="Buscar por nombre o departamento" class="form-control w-25">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a th:href="@{/empleados}" class="btn btn-secondary">Limpiar</a>
    </form>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th># Usuario</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Puesto</th>
            <th>Departamento</th>
            <th>Ciudad</th>
            <th>Código postal</th>
            <th>Salario</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${listaEmpleados}">
            <td th:text="${emp.employeeId}"></td>
            <td th:text="${emp.firstName}"></td>
            <td th:text="${emp.lastName}"></td>
            <td th:text="${emp.job.jobTitle}"></td>
            <td th:text="${emp.department.departmentName}"></td>
            <td th:text="${emp.department.location.city}"></td>
            <td th:text="${emp.department.location.postalCode}"></td>
            <td th:text="${emp.salary}"></td>
            <td><a th:href="@{'/empleados/editar/' + ${emp.employeeId}}" class="btn btn-sm btn-warning">Editar</a></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
